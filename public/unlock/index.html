<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unlock — Gabochie consoles</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/">Gabochie <b>DevOps</b></a></div></header>
<main class="wrap">
<div class="card" style="max-width:26rem">
<h2>Private consoles</h2>
<p class="mut">Enter the console token to open the Hardening Console and Portfolio OS on this device for 30 days.</p>
<form method="post" action="/unlock/">
<label for="token">Console token</label><br>
<input id="token" name="token" type="password" required autocomplete="off" style="width:100%;padding:.6rem;border-radius:.5rem;border:1px solid var(--line2);background:#0B1426;color:var(--ink)">
<p><button class="btn" type="submit">Unlock</button></p>
</form>
</div>
</main>
</body>
</html>
